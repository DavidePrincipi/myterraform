#cloud-config
ssh_pwauth: True

chpasswd:
  expire: False
  list: |
    root:${root_password}

timezone: UTC

users:
 - name: cloud-user
   ssh_authorized_keys:
     %{~ for sshkey in sshkeys ~}
     - |
       ${sshkey}
     %{~ endfor ~}

runcmd:
 - |
   set -x
   runuser -u cloud-user -- ssh-keygen -t ecdsa -N '' -f ~cloud-user/.ssh/id_ecdsa
   cat /home/cloud-user/.ssh/id_ecdsa.pub >> ~root/.ssh/authorized_keys
   mkdir -m 0700 -v -p /etc/nethserver/skel/.ssh
   cat ~root/.ssh/authorized_keys >> /etc/nethserver/skel/.ssh/authorized_keys
   %{~ if swapsz > 0 ~}
   echo "Setup swapfile..."
   dd if=/dev/zero of=/swapfile count=${swapsz} bs=1MiB
   chmod 600 /swapfile
   mkswap /swapfile
   swapon /swapfile
   echo '/swapfile   swap    swap    sw  0   0' >> /etc/fstab
   sysctl -w vm.swappiness=10 vm.vfs_cache_pressure=50 | tee /etc/sysctl.d/80-swapfile.conf
   %{~ endif ~}
   %{~ if !kernel_update ~}
   echo "exclude=kernel* kmod* microcode_ctl grub2*" >> /etc/yum.conf
   %{~ endif ~}
   { curl '${install_url}' || wget -q -O - '${install_url}' ; } | TESTING=${testing_modules} bash -s ${install_args}
   [ '${acme_staging}' = true ] && /usr/local/bin/api-cli run module/traefik1/set-acme-server --data '{"url":"https://acme-staging-v02.api.letsencrypt.org/directory"}'
   /usr/local/bin/api-cli run node/1/set-fqdn -d '{"hostname":"'$(hostname -s)'","domain":"'$(hostname -d)'"}'
   %{~ if sshport != 22 ~}
   echo "Setup SSH port redirect: ${sshport} -> 22..."
   firewall-cmd --permanent --add-forward-port=port=${sshport}:proto=tcp:toport=22
   firewall-cmd --permanent --service=ssh --add-port=${sshport}/tcp
   firewall-cmd --permanent --service=ssh --remove-port=22/tcp
   firewall-cmd --reload
   %{~ endif ~}
   dnf install -y jq git tmux || apt-get -y install jq git tmux
   %{~ if my_secret != "" ~}
   echo "Create the cluster and register it on my.nethesis.it..."
   /usr/local/sbin/create-cluster $(hostname -f):55820 10.5.4.0/24 Nethesis,1234
   /usr/local/bin/api-cli run cluster/set-subscription --data '{"subscription":{"auth_token":"${my_secret}"}}'
   %{~ endif ~}
%{ if kernel_update ~}

power_state:
  mode: reboot
  message: Reboot to apply the kernel updates
%{ endif ~}
